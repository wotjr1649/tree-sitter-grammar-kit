name: PREPARE P05

on:
  workflow_dispatch:
    inputs:
      approval_reference:
        description: Approved PREPARE-03 receipt SHA-256
        required: true
        type: string
      reviewed_commit:
        description: Verified main commit for this execution
        required: true
        type: string
      acquisition_profile:
        description: Separately authorized acquisition profile
        required: true
        type: choice
        default: archive-r1
        options:
          - archive-r1
          - pinned-tsql-r1
      acquisition_approval_subject:
        description: Separate immutable approval subject for pinned-tsql-r1
        required: false
        type: string
      execution_approval_subject:
        description: Separate immutable approval subject for quiescent tmpfs capture
        required: true
        type: string
      toolchain_profile:
        description: Separately authorized immutable toolchain image
        required: true
        type: choice
        default: bookworm-r1
        options:
          - bookworm-r1
          - trixie-r1
      toolchain_approval_subject:
        description: Separate GLIBC image subject required for trixie-r1
        required: false
        type: string
      tsql_prior_evidence_subject:
        description: Verified immutable run36646415814 observations; retain failed scope without repeating identical TSQL probes
        required: false
        type: string
      csharp_prior_evidence_subject:
        description: Verified immutable run36651074932 observations; retain failed directives and broader declared identifier gap
        required: false
        type: string
      ts_pg_stage_evidence_subject:
        description: Verified run36657324824 TS/TSX results and unrun PG stage blockers; no unchanged repeat
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tsgk-campaign-heavy
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - name: 승인과 실제 checkout 확인
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          EXPECTED_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ inputs.reviewed_commit }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if ($env:APPROVAL_REFERENCE -cne 'b28d726cf456472b8d37117818930500188f730aafb18bcb6b636214d34ec752') { throw 'Approved receipt reference mismatch' }
          if ($env:REVIEWED_SHA -notmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_SHA -cne $env:REVIEWED_SHA) { throw 'Reviewed main commit mismatch' }
          if ((git rev-parse HEAD) -cne $env:EXPECTED_SHA -or $LASTEXITCODE -ne 0) { throw 'Checkout mismatch' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'Checkout is not clean' }
          if (-not $env:ImageOS -or -not $env:ImageVersion) { throw 'Runner identity unavailable' }
          Write-Output "checkout=$env:EXPECTED_SHA image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT pwsh=$($PSVersionTable.PSVersion)"
      - name: 승인한 취득과 격리 P05 실행
        env:
          ACQUISITION_PROFILE: ${{ inputs.acquisition_profile }}
          ACQUISITION_APPROVAL_SUBJECT: ${{ inputs.acquisition_approval_subject }}
          EXECUTION_APPROVAL_SUBJECT: ${{ inputs.execution_approval_subject }}
          TOOLCHAIN_PROFILE: ${{ inputs.toolchain_profile }}
          TOOLCHAIN_APPROVAL_SUBJECT: ${{ inputs.toolchain_approval_subject }}
          TSQL_PRIOR_EVIDENCE_SUBJECT: ${{ inputs.tsql_prior_evidence_subject }}
          CSHARP_PRIOR_EVIDENCE_SUBJECT: ${{ inputs.csharp_prior_evidence_subject }}
          TS_PG_STAGE_EVIDENCE_SUBJECT: ${{ inputs.ts_pg_stage_evidence_subject }}
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP "tsgk-p05-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/prepare-p05/run.ps1 -Destination $taskRoot -AcquisitionProfile $env:ACQUISITION_PROFILE -AcquisitionApprovalSubject $env:ACQUISITION_APPROVAL_SUBJECT -ExecutionApprovalSubject $env:EXECUTION_APPROVAL_SUBJECT -ToolchainProfile $env:TOOLCHAIN_PROFILE -ToolchainApprovalSubject $env:TOOLCHAIN_APPROVAL_SUBJECT -TsqlPriorEvidenceSubject $env:TSQL_PRIOR_EVIDENCE_SUBJECT -CsharpPriorEvidenceSubject $env:CSHARP_PRIOR_EVIDENCE_SUBJECT -TsPgStageEvidenceSubject $env:TS_PG_STAGE_EVIDENCE_SUBJECT
      - name: 원본 근거를 유한 artifact로 묶기
        if: always()
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP "tsgk-p05-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/prepare-p05/collect.ps1 -Root $taskRoot
      - name: 해당 run의 근거 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p05-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tsgk-p05-${{ github.run_id }}-${{ github.run_attempt }}/evidence.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: 실제 checkout 보존 확인
        if: always()
        run: |
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'Checkout changed' }
