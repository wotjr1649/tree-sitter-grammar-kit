name: Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsgk-campaign-heavy
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  foundation:
    name: foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: 고정 Go module 취득
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          # Only the modules pinned by go.mod/go.sum (golang.org/x/sys); later steps run with GOPROXY=off.
          go mod download -json
          if ($LASTEXITCODE -ne 0) { throw 'pinned module download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          $treeState = git status --porcelain=v1 --untracked-files=all --ignored=matching
          if ($LASTEXITCODE -ne 0) { throw 'CI worktree query failed' }
          if ($treeState) { throw 'CI requires a clean worktree including untracked and ignored files' }
      - name: 실행 identity 확인
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or [string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'Runner image identity missing' }
          $goIdentity = go version
          if ($LASTEXITCODE -ne 0) { throw 'go version failed' }
          if ($goIdentity -ne "go version go1.27.1 $env:EXPECTED_GOOS/$env:EXPECTED_GOARCH") { throw 'Go host identity mismatch' }
          $goIdentity
          Write-Output "PowerShell=$($PSVersionTable.PSVersion) runner=$env:RUNNER_OS/$env:RUNNER_ARCH image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT event=$env:GITHUB_EVENT_NAME"
          $checkoutSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'checkout identity failed' }
          if ($checkoutSha -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$checkoutSha pr_head_sha=$env:PR_HEAD_SHA"
      - name: S05 native 도구 준비 (고정 runtime source, 기존 C 컴파일러)
        env:
          PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          # Only the pinned runtime archive is fetched (hash-checked per file); no compiler is installed.
          $dest = Join-Path $env:RUNNER_TEMP "s05-native-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/s05-native/prepare-routes.ps1 -Destination $dest -Platform $env:PLATFORM -Routes none
          $cc = & src/dev/s05-native/select-compiler.ps1
          "TSGK_NATIVE_RUNTIME=$(Join-Path $dest 'runtime')" >> $env:GITHUB_ENV
          "TSGK_NATIVE_CC=$cc" >> $env:GITHUB_ENV
          'TSGK_NATIVE_REQUIRED=1' >> $env:GITHUB_ENV
      - name: 형식과 foundation 검사
        run: |
          $formatted = gofmt -l src
          if ($LASTEXITCODE -ne 0 -or $formatted) { throw 'gofmt failed' }
          if ($IsLinux) {
            # Delegate a cgroup v2 subtree so the runner's hard memory cap is exercised: this
            # shell moves into a leaf, the runner creates per-process leaves below jobs/.
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo mkdir -p "$base/supervisor" "$base/jobs"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
            sudo chown -R "$(id -u):$(id -g)" $base
            if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
            Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
            $env:TSGK_CGROUP_PARENT = "$base/jobs"
          }
          go test ./src/... -count=1 -v -timeout 300s
          if ($LASTEXITCODE -ne 0) { throw 'test failed' }
      - name: frame 상태와 native cancellation 반복 시험 (#65)
        timeout-minutes: 4
        run: |
          if ($IsLinux) {
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            $env:TSGK_CGROUP_PARENT = "$base/jobs"
          }
          go test ./src/internal/runner -count=20 -failfast -timeout 180s -run '^(TestFrameStatusMapping|TestFrameEscapedStdoutHolder|TestFrameWatchdogRealTimer)$'
          if ($LASTEXITCODE -ne 0) { throw 'repeated frame tests failed' }
          go test ./src/internal/native -count=20 -failfast -timeout 120s -run '^TestLimitsAndCancellation$/^cancellation$'
          if ($LASTEXITCODE -ne 0) { throw 'repeated native cancellation test failed' }
      - name: S04 runner tree 정리 반복 시험 (Linux cgroup v2)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          # The cgroup release race only shows on a real cgroup v2 host: repeat the tree
          # cleanup tests 20 times under the same delegated parent as the main test step.
          $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
          if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
          $env:TSGK_CGROUP_PARENT = "$base/jobs"
          go test ./src/internal/runner -count=20 -failfast -timeout 200s -run '^(TestTreeTermination|TestPipeHoldingDescendant|TestEscapedDescendant|TestEscapedQuietDescendant|TestFrameCrashWithStdoutHolder|TestCgroupLiveUntilReleased)$'
          if ($LASTEXITCODE -ne 0) { throw 'repeated tree cleanup tests failed' }
      - name: P05 도구 경로 회귀 검사
        run: |
          $taskTestRoot = Join-Path $env:RUNNER_TEMP "p05-tool-check-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/prepare-p05/self-test.ps1 -Destination $taskTestRoot
      - name: Vet와 CGO-free build
        run: |
          go vet ./src/...
          if ($LASTEXITCODE -ne 0) { throw 'vet failed' }
          go build ./src/...
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $cliPath = Join-Path $env:RUNNER_TEMP "tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          go build -o $cliPath ./src/cmd/tsgk
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'tracked files changed' }
      - name: S04 generator 재현 (owned fixture, tree-sitter 0.27.0)
        env:
          PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "s04-owned-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cgroup = ''
          if ($IsLinux) {
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            $cgroup = "$base/jobs"
          }
          & src/dev/s04-reproduce/ci-owned.ps1 -Destination $dest -Platform $env:PLATFORM -CgroupParent $cgroup
      - name: Verify clean validation output
        run: |
          $treeState = git status --porcelain=v1 --untracked-files=all --ignored=matching
          if ($LASTEXITCODE -ne 0) { throw 'CI worktree query failed' }
          if ($treeState) { throw 'CI requires a clean worktree including untracked and ignored files' }

  race:
    # Optional data-race diagnostic (#72). It needs cgo, so it is a separate lane: the
    # CGO-free foundation gate above stays the required core check and is not relaxed.
    # It waits for the three native route jobs so at most three heavy jobs run at once.
    name: race diagnostic (${{ matrix.os }})
    needs: native-routes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: ${{ matrix.os == 'macos-15' }}
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup
        continue-on-error: ${{ matrix.os == 'macos-15' }}
        with:
          go-version: '1.27.1'
          cache: false
      - name: 고정 Go module 취득
        id: modules
        continue-on-error: ${{ matrix.os == 'macos-15' }}
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          # Only the modules pinned by go.mod/go.sum (golang.org/x/sys); later steps run with GOPROXY=off.
          go mod download -json
          if ($LASTEXITCODE -ne 0) { throw 'pinned module download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: go test -race (진단, CGO)
        id: diagnostic
        if: ${{ steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' && steps.modules.outcome == 'success' }}
        continue-on-error: ${{ matrix.os == 'macos-15' }}
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          $checkoutSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse failed' }
          if ($checkoutSha -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          $goIdentity = go version
          if ($LASTEXITCODE -ne 0) { throw 'go version failed' }
          $cgo = go env CGO_ENABLED
          if ($LASTEXITCODE -ne 0) { throw 'go env failed' }
          if ($cgo -ne '1') { throw 'race diagnostic needs CGO_ENABLED=1' }
          Write-Output "$goIdentity cgo=$cgo checkout_sha=$checkoutSha run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
          if ($IsLinux) {
            # Same delegated cgroup v2 as foundation; macOS uses its process group backend.
            $base = "/sys/fs/cgroup/tsgk-race-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo mkdir -p "$base/supervisor" "$base/jobs"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
            sudo chown -R "$(id -u):$(id -g)" $base
            if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
            Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
            $env:TSGK_CGROUP_PARENT = "$base/jobs"
          }
          go test -race -count=1 -timeout 600s ./src/...
          if ($LASTEXITCODE -ne 0) { throw 'race diagnostic failed' }
      - name: 진단 outcome과 실행 identity 기록
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          PRIOR_JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GO_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          MODULES_OUTCOME: ${{ steps.modules.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "race-diagnostic-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dest | Out-Null
          [ordered]@{ schema = 'tsgk-ci-diagnostic/r1'; outcome = $env:DIAGNOSTIC_OUTCOME; prior_job_status = $env:PRIOR_JOB_STATUS; cgo_enabled = $env:CGO_ENABLED; preparation_outcomes = [ordered]@{ checkout = $env:CHECKOUT_OUTCOME; setup = $env:GO_SETUP_OUTCOME; modules = $env:MODULES_OUTCOME } } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dest 'diagnostic.json') -Encoding utf8NoBOM
          if ($env:CHECKOUT_OUTCOME -eq 'success' -and $env:GO_SETUP_OUTCOME -eq 'success') {
            & src/dev/s08-qualify/run-identity.ps1 -Destination $dest -HeadSHA $env:PR_HEAD_SHA
          } else {
            Write-Warning 'run identity unavailable: checkout or Go setup did not succeed'
          }
      - name: race 진단 근거 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: race-diagnostic-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/race-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: error
          retention-days: 7

  macos-regenerate:
    # Optional #108 lane. Alongside the two race jobs, at most three heavy jobs run.
    name: regenerate diagnostic (macos-15)
    needs: native-routes
    if: ${{ !cancelled() && needs.native-routes.result != 'skipped' }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup
        continue-on-error: true
        with:
          go-version: '1.27.1'
          cache: false
      - name: 고정 Go module 취득
        id: modules
        continue-on-error: true
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          go mod download -json
          if ($LASTEXITCODE -ne 0) { throw 'pinned module download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        id: input
        continue-on-error: true
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          $state = git status --porcelain=v1 --untracked-files=all --ignored=matching
          if ($LASTEXITCODE -ne 0 -or $state) { throw 'clean worktree check failed' }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sha -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
      - name: macOS 26 route 재생성 (등록 출력 대조)
        id: diagnostic
        if: ${{ steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' && steps.modules.outcome == 'success' && steps.input.outcome == 'success' }}
        continue-on-error: true
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "s05-macos-prepared-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/s05-native/prepare-routes.ps1 -Destination $dest -Platform darwin/arm64
          if ($LASTEXITCODE -ne 0) { throw 'macOS regeneration failed' }
          $state = git status --porcelain=v1 --untracked-files=all --ignored=matching
          if ($LASTEXITCODE -ne 0 -or $state) { throw 'clean worktree check failed' }
      - name: 진단 outcome과 실행 identity 기록
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          PRIOR_JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GO_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          MODULES_OUTCOME: ${{ steps.modules.outcome }}
          INPUT_OUTCOME: ${{ steps.input.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "macos-regeneration-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dest | Out-Null
          [ordered]@{ schema = 'tsgk-ci-diagnostic/r1'; outcome = $env:DIAGNOSTIC_OUTCOME; prior_job_status = $env:PRIOR_JOB_STATUS; cgo_enabled = $env:CGO_ENABLED; preparation_outcomes = [ordered]@{ checkout = $env:CHECKOUT_OUTCOME; setup = $env:GO_SETUP_OUTCOME; modules = $env:MODULES_OUTCOME; input = $env:INPUT_OUTCOME } } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dest 'diagnostic.json') -Encoding utf8NoBOM
          if ($env:CHECKOUT_OUTCOME -eq 'success' -and $env:GO_SETUP_OUTCOME -eq 'success') {
            & src/dev/s08-qualify/run-identity.ps1 -Destination $dest -HeadSHA $env:PR_HEAD_SHA
          } else {
            Write-Warning 'run identity unavailable: checkout or Go setup did not succeed'
          }
      - name: macOS 재생성 근거 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s05-macos-regeneration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-regeneration-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/s05-macos-prepared-${{ github.run_id }}-${{ github.run_attempt }}/prepared.json
            ${{ runner.temp }}/s05-macos-prepared-${{ github.run_id }}-${{ github.run_attempt }}/profiles/*.json
            ${{ runner.temp }}/s05-macos-prepared-${{ github.run_id }}-${{ github.run_attempt }}/repro/*/result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  native-prepare:
    # S05: one Linux job fetches the 26 pinned route sources, applies the patch chains of
    # the 6 adopted routes and regenerates all 26 parsers with tsgk reproduce (the other 20
    # without patches, C2-REGENERATE-r1); every file is hash-checked against
    # src/contracts/native-routes.json before it is handed on.
    name: native prepare (ubuntu-24.04)
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: 고정 Go module 취득
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          go mod download -json
          if ($LASTEXITCODE -ne 0) { throw 'pinned module download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$env:EXPECTED_CHECKOUT_SHA image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: 26 route source 준비와 26 route 재생성
        run: |
          $cgroup = ''
          if ($IsLinux) {
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo mkdir -p "$base/supervisor" "$base/jobs"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
            sudo chown -R "$(id -u):$(id -g)" $base
            if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
            Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
            $cgroup = "$base/jobs"
          }
          $dest = Join-Path $env:RUNNER_TEMP "s05-prepared-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/s05-native/prepare-routes.ps1 -Destination $dest -Platform linux/amd64 -CgroupParent $cgroup
          # keep the regeneration reports, drop the duplicated outputs, tools and CLI
          Get-ChildItem -LiteralPath (Join-Path $dest 'repro') -Directory | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Directory | Remove-Item -Recurse -Force }
          Remove-Item -LiteralPath (Join-Path $dest 'tools'), (Join-Path $dest 'profiles') -Recurse -Force
          Get-ChildItem -LiteralPath $dest -File -Filter 'tsgk*' | Remove-Item -Force
      - name: 준비한 입력 전달
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s05-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s05-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Verify clean validation output
        run: |
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }

  native-routes:
    # S05/S06: build the driver and run the registered edit/feature/gap cases of the 26
    # routes (tsgk incremental, r1) and record them with the route query cases, the fact
    # query pack and the dynamic SQL fixtures (tsgk oracle record, r2) on each host with its
    # existing compiler. The large C# fixtures (real-world-source-r3, native-query-large)
    # run on windows/amd64 only and are NOT_APPLICABLE elsewhere (C1-REAL-WORLD-SOURCE-WINDOWS-R3).
    name: native routes (${{ matrix.os }})
    needs: native-prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: 고정 Go module 취득
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          go mod download -json
          if ($LASTEXITCODE -ne 0) { throw 'pinned module download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$env:EXPECTED_CHECKOUT_SHA image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: 준비한 입력 받기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: s05-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s05-prepared
      - name: S05 driver sanitizer (Linux, ASan/UBSan)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The owned native suite with an AddressSanitizer/UBSan driver build: a leak, overflow
          # or use-after-free ends the driver nonzero and fails the protocol checks.
          $base = "/sys/fs/cgroup/tsgk-san-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          sudo mkdir -p "$base/supervisor" "$base/jobs"
          if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
          sudo chown -R "$(id -u):$(id -g)" $base
          if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
          sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
          if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
          Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
          Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
          $env:TSGK_CGROUP_PARENT = "$base/jobs"
          $env:TSGK_NATIVE_RUNTIME = Join-Path $env:RUNNER_TEMP 's05-prepared/runtime'
          $env:TSGK_NATIVE_CC = & src/dev/s05-native/select-compiler.ps1
          $env:TSGK_NATIVE_REQUIRED = '1'
          $env:TSGK_NATIVE_SANITIZE = '1'
          # Sanitizer runtimes older than the high-entropy ASLR fix cannot place their shadow
          # memory with 32 random mmap bits (actions/runner-images#9515). The setting is
          # kernel-wide, so it is restored before the route step runs.
          $bits = sudo sysctl -n vm.mmap_rnd_bits # /proc/sys/vm/mmap_rnd_bits is root-only
          if ($LASTEXITCODE -ne 0 -or $bits -notmatch '^\d+$') { throw 'sysctl read failed' }
          sudo sysctl -w vm.mmap_rnd_bits=28
          if ($LASTEXITCODE -ne 0) { throw 'sysctl failed' }
          try {
            go test ./src/internal/native -count=1 -timeout 420s
            if ($LASTEXITCODE -ne 0) { throw 'sanitizer native tests failed' }
          } finally {
            sudo sysctl -w "vm.mmap_rnd_bits=$bits"
            if ($LASTEXITCODE -ne 0) { throw 'sysctl restore failed' }
          }
      - name: 26 route native build와 등록 사례·query 기록 실행
        run: |
          $cgroup = ''
          if ($IsLinux) {
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo mkdir -p "$base/supervisor" "$base/jobs"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
            sudo chown -R "$(id -u):$(id -g)" $base
            if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
            Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
            $cgroup = "$base/jobs"
          }
          $cc = & src/dev/s05-native/select-compiler.ps1
          $out = Join-Path $env:RUNNER_TEMP "s05-routes-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/s05-native/run-routes.ps1 -Prepared (Join-Path $env:RUNNER_TEMP 's05-prepared') -Destination $out -Compiler $cc -Platform $env:PLATFORM -CgroupParent $cgroup -Large -Oracle
          $routesExit = $LASTEXITCODE
          # S08: the host's run identity for the qualification job, written even when cases failed
          & src/dev/s08-qualify/run-identity.ps1 -Destination $out -HeadSHA $env:PR_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'run identity failed' }
          if ($routesExit -ne 0) { throw 'route run reported failures' }
        env:
          PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: route 결과 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # S08 qualification evidence: the run identity, the S06 record sets and their
          # workload profiles; summary.json is the helper's own retained summary
          name: s05-routes-${{ matrix.goos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/run-identity.json
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/records
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/profiles/s06-*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Verify clean validation output
        run: |
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }

  qualification:
    # S08: aggregates the three native-routes hosts of this run and attempt into the
    # 26 route x 3 platform cells and the extra-role rows (tsgk qualify). Read-only and
    # tool-free; it fails on the kit gate (completeness, cohort, eligibility, mechanism,
    # cross-platform comparison) and records grammar requirement results for disposition.
    name: qualification (ubuntu-24.04)
    needs: native-routes
    if: ${{ !cancelled() && needs.native-routes.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: 고정 Go module 취득
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          go mod download -json
          if ($LASTEXITCODE -ne 0) { throw 'pinned module download failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$env:EXPECTED_CHECKOUT_SHA image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: 세 host 근거 받기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: s05-routes-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-hosts
      - name: 78칸 qualification 집계
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          $cli = Join-Path $env:RUNNER_TEMP "tsgk-qualify-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          go build -o $cli ./src/cmd/tsgk
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
          $hosts = Join-Path $env:RUNNER_TEMP 'qualification-hosts'
          $cliArgs = @('qualify', '--inventory', 'src/contracts/qualification-c1.json', '--candidate', $env:CANDIDATE)
          foreach ($p in @(@('windows', 'windows-amd64'), @('linux', 'linux-amd64'), @('darwin', 'darwin-arm64'))) {
            $dir = Join-Path $hosts "s05-routes-$($p[0])-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            if (Test-Path -LiteralPath $dir) { $cliArgs += @('--host', "$($p[1])=$dir") } else { Write-Output "host evidence missing: $($p[1])" }
          }
          $out = Join-Path $env:RUNNER_TEMP "qualification-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $out | Out-Null
          $result = Join-Path $out 'qualification.json'
          & $cli @cliArgs --out $result
          $code = $LASTEXITCODE
          & src/dev/s08-qualify/gate.ps1 -Result $result -QualifyExit $code
          if ($LASTEXITCODE -ne 0) { throw 'qualification kit gate failed' }
      - name: qualification 결과 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s08-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify clean validation output
        run: |
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
