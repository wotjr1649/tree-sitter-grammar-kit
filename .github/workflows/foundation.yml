name: Foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'

permissions:
  contents: read

# One lane for every run keeps the heavy width at 3 (D12). queue: max keeps up to 100
# pending runs instead of letting a newly queued run cancel the pending one (#252), which
# once dropped a main post-merge run; superseded PR runs are cancelled by procedure.
concurrency:
  group: tsgk-campaign-heavy
  cancel-in-progress: false
  queue: max

env:
  CGO_ENABLED: '0'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOFLAGS: '-mod=readonly'

jobs:
  foundation:
    name: foundation (${{ matrix.os }})
    # #257: a nightly run whose commit a recent push run already proved skips every job;
    # the rest follow from this skip, and the diagnostics and the gate skip only with it.
    needs: mode
    if: ${{ needs.mode.outputs.duplicate != 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    # #260: every step is bounded and outlasts the nominal deadlines it runs; the job outlasts
    # the step sum of the slowest host (Linux 54 minutes) plus a runner allowance
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 2
        with:
          go-version: '1.27.2'
          cache: false
      - name: 고정 Go module 취득
        timeout-minutes: 2
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          # Only the modules pinned by go.mod/go.sum (golang.org/x/sys); later steps run with GOPROXY=off.
          & src/dev/ci-gate/modules.ps1
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        timeout-minutes: 1
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          $treeState = git status --porcelain=v1 --untracked-files=all --ignored=matching
          if ($LASTEXITCODE -ne 0) { throw 'CI worktree query failed' }
          if ($treeState) { throw 'CI requires a clean worktree including untracked and ignored files' }
      - name: 실행 identity 확인
        timeout-minutes: 1
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or [string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'Runner image identity missing' }
          $goIdentity = go version
          if ($LASTEXITCODE -ne 0) { throw 'go version failed' }
          if ($goIdentity -ne "go version go1.27.2 $env:EXPECTED_GOOS/$env:EXPECTED_GOARCH") { throw 'Go host identity mismatch' }
          $goIdentity
          Write-Output "PowerShell=$($PSVersionTable.PSVersion) runner=$env:RUNNER_OS/$env:RUNNER_ARCH image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT event=$env:GITHUB_EVENT_NAME"
          $checkoutSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'checkout identity failed' }
          if ($checkoutSha -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$checkoutSha pr_head_sha=$env:PR_HEAD_SHA"
      - name: S05 native 도구 준비 (고정 runtime source, 기존 C 컴파일러)
        timeout-minutes: 3
        env:
          PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          # Only the pinned runtime archive is fetched (hash-checked per file); no compiler is installed.
          $dest = Join-Path $env:RUNNER_TEMP "s05-native-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/s05-native/prepare-routes.ps1 -Destination $dest -Platform $env:PLATFORM -Routes none
          $cc = & src/dev/s05-native/select-compiler.ps1
          "TSGK_NATIVE_RUNTIME=$(Join-Path $dest 'runtime')" >> $env:GITHUB_ENV
          "TSGK_NATIVE_CC=$cc" >> $env:GITHUB_ENV
          'TSGK_NATIVE_REQUIRED=1' >> $env:GITHUB_ENV
      - name: 형식과 foundation 검사
        timeout-minutes: 13
        run: |
          $formatted = gofmt -l src
          if ($LASTEXITCODE -ne 0 -or $formatted) { throw 'gofmt failed' }
          if ($IsLinux) {
            # Delegate a cgroup v2 subtree so the runner's hard memory cap is exercised: this
            # shell moves into a leaf, the runner creates per-process leaves below jobs/.
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo mkdir -p "$base/supervisor" "$base/jobs"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
            sudo chown -R "$(id -u):$(id -g)" $base
            if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
            Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
            $env:TSGK_CGROUP_PARENT = "$base/jobs"
          }
          $nativePackage = 'github.com/wotjr1649/tree-sitter-grammar-kit/src/internal/native'
          $packages = @(go list ./src/...)
          if ($LASTEXITCODE -ne 0 -or $packages -notcontains $nativePackage) { throw 'native package enumeration failed' }
          $otherPackages = @($packages | Where-Object { $_ -ne $nativePackage })
          if ($otherPackages.Count -eq 0) { throw 'other packages missing' }
          go test @otherPackages -count=1 -v -timeout 300s
          if ($LASTEXITCODE -ne 0) { throw 'test failed' }
          go test $nativePackage -count=1 -v -timeout 420s
          if ($LASTEXITCODE -ne 0) { throw 'native test failed' }
      - name: isolated bind-mount output boundary (#196)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          $testBinary = Join-Path $env:RUNNER_TEMP "tsgk-paths-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.test"
          go test -c -o $testBinary ./src/cmd/tsgk
          if ($LASTEXITCODE -ne 0) { throw 'path test build failed' }
          # A flag alone cannot authorize a mount in the parent's namespace.
          $negative = & timeout --kill-after=5s 15s env -i PATH=/usr/bin:/bin TSGK_PRIVATE_MOUNT_TEST=1 $testBinary '-test.run' '^TestBindMountMembership$' '-test.v' '-test.timeout' 10s 2>&1
          $negativeCode = $LASTEXITCODE
          Write-Output "unisolated_exit_code=$negativeCode"
          $negative | Write-Output
          if ($negativeCode -ne 1 -or ($negative -join "`n") -notmatch 'private mount namespace not established') { throw 'unisolated mount fixture was not refused' }
          # Private propagation confines mount changes to this finite child namespace.
          sudo -n timeout --kill-after=5s 40s unshare --mount --propagation private -- env -i PATH=/usr/bin:/bin TSGK_PRIVATE_MOUNT_TEST=1 $testBinary '-test.run' '^TestBindMountMembership$' '-test.v' '-test.timeout' 30s
          if ($LASTEXITCODE -ne 0) { throw 'isolated bind-mount boundary failed' }
      - name: hosted Windows subst output boundary (#215)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          TSGK_HOSTED_SUBST_TEST: '1'
        run: |
          $lines = @(go test ./src/cmd/tsgk -run '^TestHostedSubstMembership$' -count=1 -json -timeout 60s)
          $testExit = $LASTEXITCODE
          $lines | Write-Output
          if ($testExit -ne 0) { throw 'hosted subst output boundary failed' }
          $events = @($lines | ForEach-Object { $_ | ConvertFrom-Json -AsHashtable })
          $completed = @($events | Where-Object { $_['Action'] -ceq 'pass' -and $_['Test'] -ceq 'TestHostedSubstMembership' })
          if ($completed.Count -ne 1 -or @($events | Where-Object { $_['Action'] -in @('skip', 'fail') }).Count -ne 0) { throw 'hosted subst test was not executed successfully' }
          $text = ($events | ForEach-Object { $_['Output'] }) -join ''
          foreach ($marker in @('SUBST_INSIDE_REJECTED', 'SUBST_OUTSIDE_PUBLISHED')) {
            if ([regex]::Matches($text, $marker).Count -ne 1) { throw 'subst boundary witness missing' }
          }
          if ([regex]::Matches($text, 'SUBST_REMOVED').Count -ne 2) { throw 'subst cleanup witness missing' }
          if ([regex]::Matches($text, 'SUBST_DIFFERENT_TARGET_PRESERVED').Count -ne 2) { throw 'subst exact-removal witness missing' }
      - name: frame 상태와 native cancellation 반복 시험 (#65)
        timeout-minutes: 6
        run: |
          if ($IsLinux) {
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            $env:TSGK_CGROUP_PARENT = "$base/jobs"
          }
          go test ./src/internal/runner -count=20 -failfast -timeout 180s -run '^(TestFrameStatusMapping|TestFrameEscapedStdoutHolder|TestFrameWatchdogRealTimer)$'
          if ($LASTEXITCODE -ne 0) { throw 'repeated frame tests failed' }
          go test ./src/internal/native -count=20 -failfast -timeout 120s -run '^TestLimitsAndCancellation$/^cancellation$'
          if ($LASTEXITCODE -ne 0) { throw 'repeated native cancellation test failed' }
      - name: S04 runner tree 정리 반복 시험 (Linux cgroup v2)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          # The cgroup release race only shows on a real cgroup v2 host: repeat the tree
          # cleanup tests 20 times under the same delegated parent as the main test step.
          $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
          if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
          $env:TSGK_CGROUP_PARENT = "$base/jobs"
          go test ./src/internal/runner -count=20 -failfast -timeout 200s -run '^(TestTreeTermination|TestPipeHoldingDescendant|TestEscapedDescendant|TestEscapedQuietDescendant|TestFrameCrashWithStdoutHolder|TestCgroupLiveUntilReleased)$'
          if ($LASTEXITCODE -ne 0) { throw 'repeated tree cleanup tests failed' }
      - name: P05 도구 경로 회귀 검사
        timeout-minutes: 6
        run: |
          $taskTestRoot = Join-Path $env:RUNNER_TEMP "p05-tool-check-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/prepare-p05/self-test.ps1 -Destination $taskTestRoot
      - name: Vet와 CGO-free build
        timeout-minutes: 3
        run: |
          go vet ./src/...
          if ($LASTEXITCODE -ne 0) { throw 'vet failed' }
          go build ./src/...
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $cliPath = Join-Path $env:RUNNER_TEMP "tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          go build -o $cliPath ./src/cmd/tsgk
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'tracked files changed' }
      - name: S04 generator 재현 (owned fixture, tree-sitter 0.27.1)
        timeout-minutes: 5
        env:
          PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "s04-owned-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cgroup = ''
          if ($IsLinux) {
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            $cgroup = "$base/jobs"
          }
          & src/dev/s04-reproduce/ci-owned.ps1 -Destination $dest -Platform $env:PLATFORM -CgroupParent $cgroup
      - name: Margin 실행 구성 기록
        timeout-minutes: 1
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          & src/dev/ci-gate/config.ps1
          if ($LASTEXITCODE -ne 0) { throw 'margin configuration failed' }
      - name: Margin 실행 구성 보관
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-config-foundation-${{ matrix.goos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-config-foundation-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}/config.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify clean validation output
        timeout-minutes: 1
        run: |
          $treeState = git status --porcelain=v1 --untracked-files=all --ignored=matching
          if ($LASTEXITCODE -ne 0) { throw 'CI worktree query failed' }
          if ($treeState) { throw 'CI requires a clean worktree including untracked and ignored files' }

  race:
    # Optional data-race diagnostic (#72). It needs cgo, so it is a separate lane: the
    # CGO-free foundation gate above stays the required core check and is not relaxed.
    # Diagnostics wait for native/large validation and qualification; their width is 3.
    name: race diagnostic (${{ matrix.os }})
    needs: [foundation, native-prepare, native-routes, native-routes-macos, large-api, qualification]
    if: ${{ !cancelled() && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && needs.foundation.result != 'skipped' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: ${{ matrix.os == 'macos-15' }}
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup
        continue-on-error: ${{ matrix.os == 'macos-15' }}
        with:
          go-version: '1.27.2'
          cache: false
      - name: 고정 Go module 취득
        id: modules
        continue-on-error: ${{ matrix.os == 'macos-15' }}
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          # Only the modules pinned by go.mod/go.sum (golang.org/x/sys); later steps run with GOPROXY=off.
          & src/dev/ci-gate/modules.ps1
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: go test -race (진단, CGO)
        id: diagnostic
        if: ${{ steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' && steps.modules.outcome == 'success' }}
        continue-on-error: ${{ matrix.os == 'macos-15' }}
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          $checkoutSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse failed' }
          if ($checkoutSha -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          $goIdentity = go version
          if ($LASTEXITCODE -ne 0) { throw 'go version failed' }
          $cgo = go env CGO_ENABLED
          if ($LASTEXITCODE -ne 0) { throw 'go env failed' }
          if ($cgo -ne '1') { throw 'race diagnostic needs CGO_ENABLED=1' }
          Write-Output "$goIdentity cgo=$cgo checkout_sha=$checkoutSha run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
          if ($IsLinux) {
            # Same delegated cgroup v2 as foundation; macOS uses its process group backend.
            $base = "/sys/fs/cgroup/tsgk-race-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo mkdir -p "$base/supervisor" "$base/jobs"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
            sudo chown -R "$(id -u):$(id -g)" $base
            if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
            Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
            $env:TSGK_CGROUP_PARENT = "$base/jobs"
          }
          go test -race -count=1 -timeout 600s ./src/...
          if ($LASTEXITCODE -ne 0) { throw 'race diagnostic failed' }
      - name: 진단 outcome과 실행 identity 기록
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          PRIOR_JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GO_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          MODULES_OUTCOME: ${{ steps.modules.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "race-diagnostic-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dest | Out-Null
          [ordered]@{ schema = 'tsgk-ci-diagnostic/r1'; outcome = $env:DIAGNOSTIC_OUTCOME; prior_job_status = $env:PRIOR_JOB_STATUS; cgo_enabled = $env:CGO_ENABLED; preparation_outcomes = [ordered]@{ checkout = $env:CHECKOUT_OUTCOME; setup = $env:GO_SETUP_OUTCOME; modules = $env:MODULES_OUTCOME } } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dest 'diagnostic.json') -Encoding utf8NoBOM
          if ($env:CHECKOUT_OUTCOME -eq 'success' -and $env:GO_SETUP_OUTCOME -eq 'success') {
            & src/dev/s08-qualify/run-identity.ps1 -Destination $dest -HeadSHA $env:PR_HEAD_SHA
          } else {
            Write-Warning 'run identity unavailable: checkout or Go setup did not succeed'
          }
      - name: race 진단 근거 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: race-diagnostic-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/race-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: error
          retention-days: 7
      - name: 진단 실패 전파
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          MODULES_OUTCOME: ${{ steps.modules.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          foreach ($outcome in @($env:CHECKOUT_OUTCOME, $env:SETUP_OUTCOME, $env:MODULES_OUTCOME, $env:DIAGNOSTIC_OUTCOME)) {
            if ($outcome -ne 'success') { throw 'race diagnostic did not succeed' }
          }

  macos-regenerate:
    # Optional #108 lane. Alongside the two race jobs, at most three heavy jobs run.
    name: regenerate diagnostic (macos-15)
    needs: [foundation, native-prepare, native-routes, native-routes-macos, large-api, qualification]
    if: ${{ !cancelled() && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && needs.foundation.result != 'skipped' }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup
        continue-on-error: true
        with:
          go-version: '1.27.2'
          cache: false
      - name: 고정 Go module 취득
        id: modules
        continue-on-error: true
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          & src/dev/ci-gate/modules.ps1
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        id: input
        continue-on-error: true
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          $state = git status --porcelain=v1 --untracked-files=all --ignored=matching
          if ($LASTEXITCODE -ne 0 -or $state) { throw 'clean worktree check failed' }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sha -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
      - name: macOS 26 route 재생성 (등록 출력 대조)
        id: diagnostic
        if: ${{ steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' && steps.modules.outcome == 'success' && steps.input.outcome == 'success' }}
        continue-on-error: true
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "s05-macos-prepared-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/s05-native/prepare-routes.ps1 -Destination $dest -Platform darwin/arm64
          if ($LASTEXITCODE -ne 0) { throw 'macOS regeneration failed' }
          $state = git status --porcelain=v1 --untracked-files=all --ignored=matching
          if ($LASTEXITCODE -ne 0 -or $state) { throw 'clean worktree check failed' }
      - name: 진단 outcome과 실행 identity 기록
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          PRIOR_JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GO_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          MODULES_OUTCOME: ${{ steps.modules.outcome }}
          INPUT_OUTCOME: ${{ steps.input.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "macos-regeneration-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dest | Out-Null
          [ordered]@{ schema = 'tsgk-ci-diagnostic/r1'; outcome = $env:DIAGNOSTIC_OUTCOME; prior_job_status = $env:PRIOR_JOB_STATUS; cgo_enabled = $env:CGO_ENABLED; preparation_outcomes = [ordered]@{ checkout = $env:CHECKOUT_OUTCOME; setup = $env:GO_SETUP_OUTCOME; modules = $env:MODULES_OUTCOME; input = $env:INPUT_OUTCOME } } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dest 'diagnostic.json') -Encoding utf8NoBOM
          if ($env:CHECKOUT_OUTCOME -eq 'success' -and $env:GO_SETUP_OUTCOME -eq 'success') {
            & src/dev/s08-qualify/run-identity.ps1 -Destination $dest -HeadSHA $env:PR_HEAD_SHA
          } else {
            Write-Warning 'run identity unavailable: checkout or Go setup did not succeed'
          }
      - name: macOS 재생성 근거 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s05-macos-regeneration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-regeneration-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/s05-macos-prepared-${{ github.run_id }}-${{ github.run_attempt }}/prepared.json
            ${{ runner.temp }}/s05-macos-prepared-${{ github.run_id }}-${{ github.run_attempt }}/profiles/*.json
            ${{ runner.temp }}/s05-macos-prepared-${{ github.run_id }}-${{ github.run_attempt }}/repro/*/result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: 진단 실패 전파
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          MODULES_OUTCOME: ${{ steps.modules.outcome }}
          INPUT_OUTCOME: ${{ steps.input.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          foreach ($outcome in @($env:CHECKOUT_OUTCOME, $env:SETUP_OUTCOME, $env:MODULES_OUTCOME, $env:INPUT_OUTCOME, $env:DIAGNOSTIC_OUTCOME)) {
            if ($outcome -ne 'success') { throw 'regeneration diagnostic did not succeed' }
          }

  mode:
    # #252: a PR iteration labelled ci:light runs only the foundation; the heavy evidence
    # starts at native-prepare and is skipped, so the always() integration gate fails and
    # only a full run integrates. The label is read at run time, not from the event, so a
    # whole-run re-run after removing it is full; a failed lookup falls back to full.
    name: CI mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      actions: read
    outputs:
      heavy: ${{ steps.mode.outputs.heavy }}
      duplicate: ${{ steps.mode.outputs.duplicate }}
    defaults:
      run:
        shell: pwsh
    steps:
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $heavy = 'true'
          if ($env:EVENT -eq 'pull_request') {
            $labels = @(gh api --paginate "repos/$env:REPOSITORY/issues/$env:PR/labels" --jq '.[].name')
            if ($LASTEXITCODE -eq 0 -and $labels -contains 'ci:light') { $heavy = 'false' }
          }
          # #257: only a successful main push or dispatch run of this commit that finished in the
          # 24 hours before the lookup makes a nightly run a duplicate (then only this job runs);
          # a nightly success, skipped or not, never counts, and a failed lookup runs in full
          $duplicate = 'false'
          if ($env:EVENT -eq 'schedule') {
            try {
              $rows = @(gh api "repos/$env:REPOSITORY/actions/workflows/foundation.yml/runs?head_sha=$env:SHA&status=success&per_page=100" --jq '.workflow_runs[] | [.id, .event, .head_branch, .conclusion, .updated_at] | @tsv')
              if ($LASTEXITCODE -eq 0) {
                $since = [DateTimeOffset]::UtcNow.AddHours(-24)
                foreach ($row in $rows) {
                  $id, $trigger, $branch, $conclusion, $updated = $row -split "`t"
                  if ($trigger -in @('push', 'workflow_dispatch') -and $branch -eq 'main' -and $conclusion -eq 'success' -and
                    [DateTimeOffset]::Parse($updated, [Globalization.CultureInfo]::InvariantCulture) -ge $since) {
                    $duplicate = 'true'
                    "CI mode: run $id already passed $env:SHA"
                  }
                }
              }
            } catch {
              $duplicate = 'false'
            }
          }
          "heavy=$heavy" >> $env:GITHUB_OUTPUT
          "duplicate=$duplicate" >> $env:GITHUB_OUTPUT
          "CI mode: heavy=$heavy duplicate=$duplicate"
          exit 0 # a failed lookup already chose full; its exit code must not fail the job

  native-prepare:
    # S05: one Linux job fetches the 26 pinned route sources, applies the patch chains of
    # the 6 adopted routes and regenerates all 26 parsers with tsgk reproduce (the other 20
    # without patches, C2-REGENERATE-r1); every file is hash-checked against
    # src/contracts/native-routes.json before it is handed on.
    name: native prepare (ubuntu-24.04)
    needs: [foundation, mode]
    if: ${{ needs.mode.outputs.heavy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: 고정 Go module 취득
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          & src/dev/ci-gate/modules.ps1
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$env:EXPECTED_CHECKOUT_SHA image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: 26 route source 준비와 26 route 재생성
        run: |
          $cgroup = ''
          if ($IsLinux) {
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo mkdir -p "$base/supervisor" "$base/jobs"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
            sudo chown -R "$(id -u):$(id -g)" $base
            if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
            Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
            $cgroup = "$base/jobs"
          }
          $dest = Join-Path $env:RUNNER_TEMP "s05-prepared-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/s05-native/prepare-routes.ps1 -Destination $dest -Platform linux/amd64 -CgroupParent $cgroup
          # keep the regeneration reports, drop the duplicated outputs, tools and CLI
          Get-ChildItem -LiteralPath (Join-Path $dest 'repro') -Directory | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Directory | Remove-Item -Recurse -Force }
          Remove-Item -LiteralPath (Join-Path $dest 'tools'), (Join-Path $dest 'profiles') -Recurse -Force
          Get-ChildItem -LiteralPath $dest -File -Filter 'tsgk*' | Remove-Item -Force
      - name: 준비한 입력 전달
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s05-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s05-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Margin 실행 구성 기록
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          & src/dev/ci-gate/config.ps1
          if ($LASTEXITCODE -ne 0) { throw 'margin configuration failed' }
      - name: Margin 실행 구성 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-config-native-prepare-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-config-native-prepare-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}/config.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify clean validation output
        run: |
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }

  native-routes:
    # S05/S06: build the driver and run the registered edit/feature/gap cases of the 26
    # routes (tsgk incremental, observed result r3) and record them with the route query cases,
    # the fact query pack and the dynamic SQL fixtures (tsgk oracle record, observed r4; the
    # native-query-large sets stay r2, #217) on each host with its
    # existing compiler. The large C# fixtures (real-world-source-r3, native-query-large)
    # run on windows/amd64 only and are NOT_APPLICABLE elsewhere (C1-REAL-WORLD-SOURCE-WINDOWS-R3).
    name: native routes (${{ matrix.os }})
    needs: native-prepare
    strategy:
      fail-fast: false
      # Windows/Linux share the width-3 lane with Mac, then large-api after Mac.
      max-parallel: 2
      matrix:
        include:
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps: &native-route-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: 고정 Go module 취득
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          & src/dev/ci-gate/modules.ps1
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$env:EXPECTED_CHECKOUT_SHA image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: 준비한 입력 받기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: s05-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s05-prepared
      - name: S05 driver sanitizer (Linux, ASan/UBSan)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # The owned native suite with an AddressSanitizer/UBSan driver build: a leak, overflow
          # or use-after-free ends the driver nonzero and fails the protocol checks.
          $base = "/sys/fs/cgroup/tsgk-san-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          sudo mkdir -p "$base/supervisor" "$base/jobs"
          if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
          sudo chown -R "$(id -u):$(id -g)" $base
          if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
          sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
          if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
          Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
          Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
          $env:TSGK_CGROUP_PARENT = "$base/jobs"
          $env:TSGK_NATIVE_RUNTIME = Join-Path $env:RUNNER_TEMP 's05-prepared/runtime'
          $env:TSGK_NATIVE_CC = & src/dev/s05-native/select-compiler.ps1
          $env:TSGK_NATIVE_REQUIRED = '1'
          $env:TSGK_NATIVE_SANITIZE = '1'
          # Sanitizer runtimes older than the high-entropy ASLR fix cannot place their shadow
          # memory with 32 random mmap bits (actions/runner-images#9515). The setting is
          # kernel-wide, so it is restored before the route step runs.
          $bits = sudo sysctl -n vm.mmap_rnd_bits # /proc/sys/vm/mmap_rnd_bits is root-only
          if ($LASTEXITCODE -ne 0 -or $bits -notmatch '^\d+$') { throw 'sysctl read failed' }
          sudo sysctl -w vm.mmap_rnd_bits=28
          if ($LASTEXITCODE -ne 0) { throw 'sysctl failed' }
          try {
            go test ./src/internal/native -count=1 -timeout 420s
            if ($LASTEXITCODE -ne 0) { throw 'sanitizer native tests failed' }
          } finally {
            sudo sysctl -w "vm.mmap_rnd_bits=$bits"
            if ($LASTEXITCODE -ne 0) { throw 'sysctl restore failed' }
          }
      - name: 26 route native build와 등록 사례·query 기록 실행
        run: |
          $cgroup = ''
          if ($IsLinux) {
            $base = "/sys/fs/cgroup/tsgk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            sudo mkdir -p "$base/supervisor" "$base/jobs"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup create failed' }
            sudo chown -R "$(id -u):$(id -g)" $base
            if ($LASTEXITCODE -ne 0) { throw 'cgroup delegate failed' }
            sudo sh -c "echo $PID > '$base/supervisor/cgroup.procs'"
            if ($LASTEXITCODE -ne 0) { throw 'cgroup move failed' }
            Set-Content -NoNewline -Path "$base/cgroup.subtree_control" -Value '+memory'
            Set-Content -NoNewline -Path "$base/jobs/cgroup.subtree_control" -Value '+memory'
            $cgroup = "$base/jobs"
          }
          $cc = & src/dev/s05-native/select-compiler.ps1
          $out = Join-Path $env:RUNNER_TEMP "s05-routes-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          # #218: the csharp-symbols role runs on Windows and Linux; darwin is deferred (#243)
          & src/dev/s05-native/run-routes.ps1 -Prepared (Join-Path $env:RUNNER_TEMP 's05-prepared') -Destination $out -Compiler $cc -Platform $env:PLATFORM -CgroupParent $cgroup -Large -Oracle -Symbols:(-not $IsMacOS)
          $routesExit = $LASTEXITCODE
          # S08: the host's run identity for the qualification job, written even when cases failed
          & src/dev/s08-qualify/run-identity.ps1 -Destination $out -HeadSHA $env:PR_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'run identity failed' }
          if ($routesExit -ne 0) { throw 'route run reported failures' }
          # #217: a registered case's error-tree route BLOCKED is undisposed. The remaining
          # originals are dispositioned in reuse-holdouts.json, whose pinned outcome (route
          # BLOCKED with the old tree observed, kit FAIL with it omitted) is checked below.
          & src/dev/s05-native/check-dispositions.ps1 -Summary (Join-Path $out 'summary.json')
          $env:TSGK_NATIVE_REQUIRED = '1'
          $env:TSGK_CGROUP_PARENT = $cgroup
          $env:TSGK_BENCH_PREPARED = Join-Path $env:RUNNER_TEMP 's05-prepared'
          $env:TSGK_NATIVE_RUNTIME = Join-Path $env:TSGK_BENCH_PREPARED 'runtime'
          $env:TSGK_NATIVE_CC = $cc
          foreach ($route in @('json', 'tsql')) {
            if (!(Test-Path -LiteralPath (Join-Path $env:TSGK_BENCH_PREPARED "routes/$route/src/parser.c") -PathType Leaf)) { throw "reuse holdout prepared closure missing: $route" }
          }
          go test ./src/internal/native -run '^TestNativeReuseHoldouts$' -count=1 -v -timeout=300s > (Join-Path $out 'reuse-observation.log') 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'reuse holdout disposition or omit-old control failed' }
          # a skipped run passes go test; the ledger must have run in full
          if (!(Select-String -LiteralPath (Join-Path $out 'reuse-observation.log') -CaseSensitive -Quiet -Pattern '^--- PASS: TestNativeReuseHoldouts \(')) { throw 'reuse holdouts did not run' }
          if ([string]::IsNullOrWhiteSpace($env:TSGK_BENCH_PREPARED) -or !(Test-Path -LiteralPath (Join-Path $env:TSGK_BENCH_PREPARED 'routes/csharp/src/parser.c') -PathType Leaf)) { throw 'SVC reuse observation prepared closure missing' }
          go test ./src/cmd/tsgk -run '^TestIncrementalCLI$/^svc-observation$' -count=1 -v -timeout=180s > (Join-Path $out 'svc-reuse-observation.log') 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'SVC reuse observation replay controls failed' }
          # #218: the C# symbols run on the registered grammar, replayed with native-result-r5,
          # and its qualification role row with the tampering controls
          go test ./src/cmd/tsgk -run '^(TestIncrementalCLISymbolMode|TestQualifySymbolRole)$' -count=1 -v -timeout=300s > (Join-Path $out 'csharp-symbols.log') 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'C# symbols run, replay or qualification controls failed' }
          # #279: primary agreement needs the registered C# grammar; keep the active-range
          # anchors mandatory here when the owned fixture grammar lacks directives.
          go test ./src/internal/native -run '^TestNativePreprocess(Ranges|CST)$' -count=1 -v -timeout=180s >> (Join-Path $out 'csharp-symbols.log') 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'C# primary agreement or active-range anchors failed' }
          foreach ($test in @('TestIncrementalCLISymbolMode', 'TestQualifySymbolRole', 'TestNativePreprocessRanges', 'TestNativePreprocessCST')) {
            if (!(Select-String -LiteralPath (Join-Path $out 'csharp-symbols.log') -CaseSensitive -Quiet -Pattern "^--- PASS: $test \(")) { throw "C# symbols test $test did not run" }
          }
          if ($IsWindows) {
            # #193: independent JSON syntax labels and recovery/edit classification.
            # Benchmark iterations are local measurements, not a hosted speed gate.
            $env:TSGK_BENCH_PREPARED = Join-Path $env:RUNNER_TEMP 's05-prepared'
            $env:TSGK_NATIVE_CC = $cc
            go test ./src/internal/native -run '^Test(JSONHoldoutLabels|NativeJSONHoldout|NativeBenchmarkControls)$' -count=1 -v -timeout=180s > (Join-Path $out 'json-holdout.log') 2>&1
            if ($LASTEXITCODE -ne 0) { throw 'independent JSON holdout failed' }
          }
        env:
          PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: route 결과 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # S08 qualification evidence: the run identity, the S06 record sets and their
          # workload profiles, the C# symbol runs (#218, absent on darwin); summary.json is
          # the helper's own retained summary
          name: s05-routes-${{ matrix.goos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/run-identity.json
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/records
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/incremental
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/profiles/s06-*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: 독립 logger 관측 및 SVC replay 근거 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reuse-observation-${{ matrix.goos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/reuse-observation.log
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/svc-reuse-observation.log
            ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/csharp-symbols.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: 독립 JSON 평가 근거 보관 (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Separate evidence: the closed qualification host file set is unchanged.
          name: json-holdout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s05-routes-${{ github.run_id }}-${{ github.run_attempt }}/json-holdout.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Margin 실행 구성 기록
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          & src/dev/ci-gate/config.ps1
          if ($LASTEXITCODE -ne 0) { throw 'margin configuration failed' }
      - name: Margin 실행 구성 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-config-${{ github.job }}-${{ matrix.goos }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-config-${{ github.job }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}/config.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify clean validation output
        run: |
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }

  native-routes-macos:
    name: native routes (${{ matrix.os }})
    needs: native-prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps: *native-route-steps

  large-api:
    # #147: independent workloads keep their existing limits and complete evidence.
    name: large API (windows-2025)
    needs: [native-prepare, native-routes-macos]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: 고정 Go module 취득
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          & src/dev/ci-gate/modules.ps1
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$env:EXPECTED_CHECKOUT_SHA image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: 준비한 입력 받기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: s05-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s05-prepared
      - name: Windows 대용량 전체 API audit
        timeout-minutes: 45
        run: |
          $cc = & src/dev/s05-native/select-compiler.ps1
          $work = Join-Path $env:RUNNER_TEMP "large-api-work-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $receipt = Join-Path $env:RUNNER_TEMP "large-api-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          go run ./src/dev/large-api -session -prepared (Join-Path $env:RUNNER_TEMP 's05-prepared') -cc $cc -work $work -out $receipt
          $auditExit = $LASTEXITCODE
          $identity = Join-Path $env:RUNNER_TEMP "large-api-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $identity | Out-Null
          & src/dev/s08-qualify/run-identity.ps1 -Destination $identity -HeadSHA $env:PR_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'large API identity failed' }
          if ($auditExit -ne 0) { throw 'large API audit failed' }
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Windows 대용량 API audit 근거 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: large-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/large-api-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/large-api-identity-${{ github.run_id }}-${{ github.run_attempt }}/run-identity.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Margin 실행 구성 기록
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          & src/dev/ci-gate/config.ps1
          if ($LASTEXITCODE -ne 0) { throw 'margin configuration failed' }
      - name: Margin 실행 구성 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-config-large-api-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-config-large-api-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}/config.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify clean validation output
        run: |
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }

  qualification:
    # S08: aggregates the three native-routes hosts of this run and attempt into the
    # 26 route x 3 platform cells and the extra-role rows (tsgk qualify). Read-only and
    # tool-free; it fails on the kit gate (completeness, cohort, eligibility, mechanism,
    # cross-platform comparison) and records grammar requirement results for disposition.
    name: qualification (ubuntu-24.04)
    needs: [native-routes, native-routes-macos]
    if: ${{ !cancelled() && needs.native-routes.result != 'skipped' && needs.native-routes-macos.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: 고정 Go module 취득
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          & src/dev/ci-gate/modules.ps1
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Verify clean validation input
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          Write-Output "checkout_sha=$env:EXPECTED_CHECKOUT_SHA image=$env:ImageOS/$env:ImageVersion run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
      - name: 세 host 근거 받기
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: s05-routes-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-hosts
      - name: 세 host 근거 목록 지연 확인
        id: hosts
        if: ${{ needs.native-routes.result == 'success' && needs.native-routes-macos.result == 'success' }}
        run: |
          # The producers succeeded, but the artifact listing can trail them; wait once before qualify.
          $hosts = Join-Path $env:RUNNER_TEMP 'qualification-hosts'
          $missing = @('windows', 'linux', 'darwin') | Where-Object { -not (Test-Path -LiteralPath (Join-Path $hosts "s05-routes-$_-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")) }
          if ($missing) {
            Write-Output "artifact listing missing $($missing -join ','); retrying once after 60 s"
            Start-Sleep -Seconds 60
          }
          "missing=$($missing -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: 세 host 근거 다시 받기
        if: ${{ steps.hosts.outputs.missing != '' && steps.hosts.outcome == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: s05-routes-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-hosts-retry
      - name: 다시 받은 host 근거 반영
        if: ${{ steps.hosts.outputs.missing != '' && steps.hosts.outcome == 'success' }}
        env:
          MISSING_HOSTS: ${{ steps.hosts.outputs.missing }}
        run: |
          # Only the hosts absent from the first download move in; already received hosts are kept.
          foreach ($os in $env:MISSING_HOSTS.Split(',')) {
            $name = "s05-routes-$os-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $retry = Join-Path (Join-Path $env:RUNNER_TEMP 'qualification-hosts-retry') $name
            if (Test-Path -LiteralPath $retry) { Move-Item -LiteralPath $retry -Destination (Join-Path (Join-Path $env:RUNNER_TEMP 'qualification-hosts') $name) } else { Write-Output "host evidence still missing: $os" }
          }
      - name: 78칸 qualification 집계
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          $cli = Join-Path $env:RUNNER_TEMP "tsgk-qualify-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          go build -o $cli ./src/cmd/tsgk
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
          $hosts = Join-Path $env:RUNNER_TEMP 'qualification-hosts'
          $cliArgs = @('qualify', '--inventory', 'src/contracts/qualification-c1.json', '--candidate', $env:CANDIDATE)
          foreach ($p in @(@('windows', 'windows-amd64'), @('linux', 'linux-amd64'), @('darwin', 'darwin-arm64'))) {
            $dir = Join-Path $hosts "s05-routes-$($p[0])-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            if (Test-Path -LiteralPath $dir) { $cliArgs += @('--host', "$($p[1])=$dir") } else { Write-Output "host evidence missing: $($p[1])" }
          }
          $out = Join-Path $env:RUNNER_TEMP "qualification-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $out | Out-Null
          $result = Join-Path $out 'qualification.json'
          & $cli @cliArgs --out $result
          $code = $LASTEXITCODE
          & src/dev/s08-qualify/gate.ps1 -Result $result -QualifyExit $code
          if ($LASTEXITCODE -ne 0) { throw 'qualification kit gate failed' }
      - name: qualification 결과 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s08-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-${{ github.run_id }}-${{ github.run_attempt }}/qualification.json
          if-no-files-found: error
          retention-days: 7
      - name: Margin 실행 구성 기록
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          & src/dev/ci-gate/config.ps1
          if ($LASTEXITCODE -ne 0) { throw 'margin configuration failed' }
      - name: Margin 실행 구성 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-config-qualification-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-config-qualification-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}/config.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify clean validation output
        run: |
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }

  integration-gate:
    name: integration gate
    needs: [foundation, native-prepare, native-routes, native-routes-macos, large-api, qualification]
    if: ${{ always() && !(github.event_name == 'schedule' && needs.foundation.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          clean: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: 고정 module 및 gate 준비
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCER_RESULTS: ${{ toJSON(needs) }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sha -ne $env:EXPECTED_CHECKOUT_SHA) { throw 'checkout SHA mismatch' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
          & src/dev/ci-gate/modules.ps1
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
          $env:GOPROXY = 'off'
          $work = Join-Path $env:RUNNER_TEMP "integration-gate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $work | Out-Null
          & src/dev/s08-qualify/run-identity.ps1 -Destination $work -HeadSHA $env:PR_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'gate identity failed' }
          [IO.File]::WriteAllText((Join-Path $work 'needs.json'), $env:PRODUCER_RESULTS, [Text.UTF8Encoding]::new($false))
          go build -o (Join-Path $work 'ci-gate') ./src/dev/ci-gate
          if ($LASTEXITCODE -ne 0) { throw 'gate build failed' }
      - name: 공식 digest를 확인한 현재 run artifact 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP "integration-gate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & src/dev/ci-gate/fetch.ps1 -Gate (Join-Path $work 'ci-gate') -Expected (Join-Path $work 'run-identity.json') -Work $work
          if ($LASTEXITCODE -ne 0) { throw 'current-run artifact download failed' }
      - name: 필수 producer와 raw 78칸 및 large 근거 확인
        run: |
          $work = Join-Path $env:RUNNER_TEMP "integration-gate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & (Join-Path $work 'ci-gate') verify -expected (Join-Path $work 'run-identity.json') -artifacts (Join-Path $work 'artifacts') -needs (Join-Path $work 'needs.json') -out (Join-Path $work 'result.json')
          if ($LASTEXITCODE -ne 0) { throw 'integration gate failed' }
          if (git status --porcelain=v1 --untracked-files=all --ignored=matching) { throw 'CI requires a clean worktree including untracked and ignored files' }
      - name: 통합 gate 근거 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/integration-gate-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/integration-gate-${{ github.run_id }}-${{ github.run_attempt }}/run-identity.json
          if-no-files-found: error
          retention-days: 7
      - name: 시간 여유 및 동일 구성 표본 판정
        id: margin
        run: |
          $work = Join-Path $env:RUNNER_TEMP "integration-gate-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & (Join-Path $work 'ci-gate') margin -expected (Join-Path $work 'run-identity.json') -artifacts (Join-Path $work 'artifacts') -metadata (Join-Path $work 'metadata') -history (Join-Path $work 'margin') -core (Join-Path $work 'result.json') -out (Join-Path $work 'margin.json')
          if ($LASTEXITCODE -ne 0) { throw 'CI margin failed' }
      - name: Margin 현재 표본과 판정 보관
        if: ${{ always() && steps.margin.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-margin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-gate-${{ github.run_id }}-${{ github.run_attempt }}/margin.json
          if-no-files-found: error
          retention-days: 30
